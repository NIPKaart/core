name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PHP 8.4
            php-version: '8.4'
            coverage: xdebug
          - name: PHP 8.5
            php-version: '8.5'
            coverage: xdebug

    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: nipkaart_test
          POSTGRES_USER: db
          POSTGRES_PASSWORD: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U db -d nipkaart_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: nipkaart_test
      DB_USERNAME: db
      DB_PASSWORD: db
      SCOUT_DRIVER: 'null'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: ${{ matrix.coverage }}
          extensions: pdo_pgsql

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Seed baseline data
        run: |
          php artisan db:seed --force
          php artisan db:seed --class=MunicipalityWithParkingSeeder --force
          php artisan db:seed --class=MunicipalityWithOffstreetSeeder --force

      - name: Build Assets
        run: npm run build

      - name: Tests with Coverage
        run: ./vendor/bin/pest --compact --coverage
